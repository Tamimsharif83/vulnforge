<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    # mod_php runs .php by default; add .phtml so the upload lab's High bypass runs.
    <FilesMatch "\.(phtml|php)$">
        SetHandler application/x-httpd-php
    </FilesMatch>
    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
