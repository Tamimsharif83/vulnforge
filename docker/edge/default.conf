server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 8m;

    # Re-resolve the app container via Docker's embedded DNS on each request, so
    # a rebuilt app (new container IP) is always found. Using a variable in
    # proxy_pass forces runtime resolution instead of a cached startup lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream app;

    location / {
        proxy_pass http://$app_upstream:80;
        proxy_http_version 1.1;
        # Pass the client's Host through unchanged: the Host header labs depend on it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
