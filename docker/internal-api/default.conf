# Internal-only service. Unreachable from the host; only other containers on
# labnet can reach it. Any path returns the same internal secret.
server {
    listen 80 default_server;
    default_type application/json;
    location / {
        return 200 '{"service":"internal-api","note":"internal admin endpoint, not for public access","admin_token":"FORGE-INTERNAL{ssrf_reached_the_internal_service}"}';
    }
}
