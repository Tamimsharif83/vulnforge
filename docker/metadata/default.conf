# Mock cloud metadata service, reachable at 169.254.169.254 inside the lab
# network. Mirrors the shape attackers target on real cloud instances.
server {
    listen 80 default_server;
    default_type text/plain;
    location = / { return 200 'latest/'; }
    location = /latest/meta-data/iam/security-credentials/ { return 200 'forge-role'; }
    location /latest/ {
        default_type application/json;
        return 200 '{"Code":"Success","Type":"AWS-HMAC","AccessKeyId":"ASIAFORGEEXAMPLE","SecretAccessKey":"FORGE-METADATA{ssrf_stole_cloud_credentials}","Token":"IQoJb3Jp…mock"}';
    }
}
